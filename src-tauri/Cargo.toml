[package]
name = "lilith-artworks"
version = "0.1.0"
description = "Branch-aware artwork history and provenance manager"
authors = ["Lilith Artworks contributors"]
edition = "2021"

[lib]
name = "lilith_artworks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
ico = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11", features = ["tray-icon", "image-ico"] }
tauri-plugin-dialog = "2.4"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
strip = true
