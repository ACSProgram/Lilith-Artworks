[package]
name = "lilith-artworks"
version = "0.3.0-alpha.5"
description = "Branch-aware artwork history and provenance manager"
authors = ["ACSProgram"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "lilith_artworks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 无头命令行入口：仅供发布前的压力测试以独立进程调用真实可执行文件。
# 不属于产品功能，不进发布产物，因此**不加入 default**。
[features]
headless = []

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
bcdec_rs = "0.2"
c2pa = { version = "0.90.11", default-features = false, features = ["file_io", "rust_native_crypto", "http_ureq"] }
flate2 = "1"
hex = "0.4"
ico = "0.5"
image = { version = "0.25.6", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tga", "webp", "tiff"] }
image_dds = { version = "0.7", default-features = false, features = ["ddsfile", "image", "encode"] }
log = "0.4"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11", features = ["tray-icon", "image-ico"] }
tauri-plugin-dialog = "2.4"
tauri-plugin-fs = "2.5"
tauri-plugin-log = "2.9"
tauri-plugin-single-instance = "2.4"
tempfile = "3"
thiserror = "2"
trustmark = "0.4"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"
# 缩略图只需读取 ZIP 容器（`.procreate`），不写不压缩：`deflate` 会把 zopfli
# 编码器和 zlib-rs 一起拉进来，`deflate-flate2` 只复用已有 flate2。c2pa 已经带进
# 同一版本的 zip（关掉了默认特性），这里不开默认特性就不会多编一份实现。
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
zstd = "0.13"

# 仅测试使用：仓库临时目录清扫的单测需要把会话目录的修改时间拨回宽限期之前。
[dev-dependencies]
filetime = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
strip = true

# `tauri dev` 默认使用本档。opt-level 0 会让依赖里的 C 代码（zstd、SQLite）与
# 纯 Rust 编解码全部不优化，提交/恢复/素材板解码比 release 慢一个数量级。
# 依赖整体提到 2、本 crate 取 1、调试信息只留行号表：热点路径接近 release，
# 增量编译不受影响（无 LTO、codegen-units 不变），链接因调试信息瘦身更快。
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(windows)'.dependencies]
# `Win32_System_WindowsProgramming` 只为压力测试里的 CPU 周期计数
# （`QueryProcessCycleTime`）开启：Windows 的 CPU 时间按 15.625 ms 的时钟中断记账，
# 几十毫秒的操作会被量化到无法比较。这个 feature 只增加 extern 声明，不引入新 crate，
# 也不改变发布产物（未使用的声明会被链接器丢弃）。
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Shell"] }
