[package]
name = "lilith-artworks"
version = "0.2.0-alpha.3"
description = "Branch-aware artwork history and provenance manager"
authors = ["ACSProgram"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "lilith_artworks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 无头命令行入口：仅供发布前的压力测试以独立进程调用真实可执行文件。
# 不属于产品功能，不进发布产物，因此**不加入 default**。
[features]
headless = []

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
bcdec_rs = "0.2"
c2pa = { version = "0.90.11", default-features = false, features = ["file_io", "rust_native_crypto", "http_ureq"] }
hex = "0.4"
ico = "0.5"
image = { version = "0.25.6", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tga", "webp", "tiff"] }
image_dds = { version = "0.7", default-features = false, features = ["ddsfile", "image", "encode"] }
log = "0.4"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11", features = ["tray-icon", "image-ico"] }
tauri-plugin-dialog = "2.4"
tauri-plugin-fs = "2.5"
tauri-plugin-log = "2.9"
tauri-plugin-single-instance = "2.4"
tempfile = "3"
thiserror = "2"
trustmark = "0.4"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"
zstd = "0.13"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Shell"] }
