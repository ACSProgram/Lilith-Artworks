name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies against the official registry
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Audit complete dependency graph against the official registry
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # audit-check splits this input on commas only. A YAML block scalar
          # with one id per line collapses into a single invalid `--ignore`
          # argument, which makes cargo-audit exit without JSON on stdout and
          # the action fail with "Unexpected end of JSON input".
          #
          # RUSTSEC-2026-0367/0368/0369 (zip 8.x): our zip 8.6.0 is a transitive
          # dependency of c2pa 0.90.11, which only reads archive assets and is
          # never handed untrusted ZIP files, so the vulnerable extract-to-disk
          # paths (symlink escape, SUID/SGID preservation) are unreachable.
          # c2pa 0.91.3 moves to zip 9.0.4, but its validator rejects manifests
          # signed by <= 0.90 (soft binding values stored as CBOR text strings
          # now fail "claim.malformed"), which would fail closed every
          # previously published record. Ignored until upstream offers a
          # migration path for old manifests; tracked in docs/planning/todo.md.
          ignore: RUSTSEC-2023-0071,RUSTSEC-2024-0370,RUSTSEC-2024-0429,RUSTSEC-2024-0436,RUSTSEC-2025-0075,RUSTSEC-2025-0080,RUSTSEC-2025-0081,RUSTSEC-2025-0098,RUSTSEC-2025-0100,RUSTSEC-2026-0367,RUSTSEC-2026-0368,RUSTSEC-2026-0369

      - name: Generate source dependency SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: lilith-artworks-source-sbom.cdx.json
          output-file: lilith-artworks-source-sbom.cdx.json
          upload-release-assets: false

  validate:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release metadata
        run: npm run verify:release-metadata

      - name: Generate Windows target licenses
        run: npm run legal

      - name: Check generated licenses are current
        run: git diff --exit-code -- licenses/THIRD_PARTY_LICENSES.html

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Check headless test gate
        run: cargo test --manifest-path src-tauri/Cargo.toml --test gate_guard

      # 便宜的八组压力测试进 CI（合计约 30 秒运行，外加一次 headless 构建）。它们覆盖
      # 取消、强杀、孤儿回收、损坏恢复、画板 DDS、认证、多进程并发边界与输入域极值——
      # 这些此前只在发布前手动跑，日常改动得不到回归保护。大文件（stress_large，几十分钟）
      # 与规模（stress_scale，约 50 秒）仍留在手动档，见 docs/guides/validation.md。
      - name: Build headless binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --features headless

      - name: Run headless stress tests (fast groups)
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --features headless --test stress_cancel
          cargo test --manifest-path src-tauri/Cargo.toml --features headless --test stress_crash
          cargo test --manifest-path src-tauri/Cargo.toml --features headless --test stress_cleanup
          cargo test --manifest-path src-tauri/Cargo.toml --features headless --test stress_damage
          cargo test --manifest-path src-tauri/Cargo.toml --features headless --test stress_pin_board
          cargo test --manifest-path src-tauri/Cargo.toml --features headless --test stress_authenticity
          cargo test --manifest-path src-tauri/Cargo.toml --features headless --test stress_concurrency
          cargo test --manifest-path src-tauri/Cargo.toml --features headless --test stress_input
