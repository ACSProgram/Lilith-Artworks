name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies against the official registry
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Audit complete dependency graph against the official registry
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # audit-check splits this input on commas only. A YAML block scalar
          # with one id per line collapses into a single invalid `--ignore`
          # argument, which makes cargo-audit exit without JSON on stdout and
          # the action fail with "Unexpected end of JSON input".
          ignore: RUSTSEC-2023-0071,RUSTSEC-2024-0370,RUSTSEC-2024-0429,RUSTSEC-2024-0436,RUSTSEC-2025-0075,RUSTSEC-2025-0080,RUSTSEC-2025-0081,RUSTSEC-2025-0098,RUSTSEC-2025-0100

      - name: Generate source dependency SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: lilith-artworks-source-sbom.cdx.json
          output-file: lilith-artworks-source-sbom.cdx.json
          upload-release-assets: false

  validate:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release metadata
        run: npm run verify:release-metadata

      - name: Generate Windows target licenses
        run: npm run legal

      - name: Check generated licenses are current
        run: git diff --exit-code -- licenses/THIRD_PARTY_LICENSES.html

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
